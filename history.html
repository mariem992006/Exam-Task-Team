<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="history.css">
</head>
<body>
     <div class="d-flex h-100">

            <div class="bg-white p-3 d-flex flex-column justify-content-between" style="width: 260px;">
                <div>

                    <div class="d-flex align-items-center gap-3 mb-4 border-bottom">
                        <img src="assets/IMG-20260806-WA0003.jpg" class="computer" alt="logo">
                        <div>
                            <h5 class="fw-bold text-dark MMO">MM&O</h5>
                        </div>
                    </div>

                    <div class="d-flex flex-column gap-2">
                        <a href="exam.html" class="btn fw-bold texnav">
                            <i class="bi bi-house-door-fill me-2"></i> Home
                        </a>
                        <a href="history.html" class="btn fw-bold texnav">
                            <i class="bi bi-clock-history me-2"></i> Quiz History
                        </a>
                        <a href="rank.html" class="btn fw-bold texnav">
                            <i class="bi bi-trophy me-2"></i> Rank with Friends
                        </a>
                    </div>
                </div>

                <div>
                    <div class="d-flex flex-column gap-2 mb-3">
                        <button id="deleteBtn" class="btn fw-bold setting"><i class="bi bi-trash3 me-2"></i>Delete
                            Profile</button>
                        <button id="logoutBtn" class="btn fw-bold setting"><i class="bi bi-box-arrow-right me-2"></i>Log
                            Out</button>
                    </div>
                </div>
            </div>
    <div class="container py-5">

    <div class="history-card">

        <div class="d-flex justify-content-between align-items-center mb-5">

            <div>

                <h2 class="fw-bold">Exam History</h2>

                <p class="text-muted">
                    View all your completed exams and performance
                </p>

            </div>

            <div class="history-img">

                <i class="bi bi-clipboard2-check"></i>

            </div>

        </div>

        <!-- Statistics -->

        <div class="row g-4 mb-5">

            <div class="col-lg-3">

                <div class="info-card total-card">

                    <div class="icon-circle total-icon">
                        <i class="bi bi-file-earmark-text"></i>
                    </div>

                    <h3 id="totalExam">0</h3>

                    <p>Total Exams</p>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="info-card correct-card">

                    <div class="icon-circle correct-icon">
                        <i class="bi bi-star"></i>
                    </div>

                    <h3 id="averageScore">0%</h3>

                    <p>Average Score</p>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="info-card wrong-card">

                    <div class="icon-circle wrong-icon">
                        <i class="bi bi-trophy"></i>
                    </div>

                    <h3 id="highestScore">0%</h3>

                    <p>Highest Score</p>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="info-card score-card">

                    <div class="icon-circle score-icon">
                        <i class="bi bi-calendar-event"></i>
                    </div>

                    <h3 id="lastExam">--</h3>

                    <p>Last Exam</p>

                </div>

            </div>

        </div>

        <!-- Search -->

        <div class="row mb-4">

            <div class="col-lg-6">

                <input
                    id="searchInput"
                    type="text"
                    class="form-control search-box"
                    placeholder="Search Exam">

            </div>

            <div class="col-lg-3">

                <select  id="subjectFilter" class="form-select search-box">

                    <option>All Subjects</option>

                </select>

            </div>

            <div class="col-lg-3">

                <select   class="form-select search-box">

                    <option>Newest</option>

                    <option>Oldest</option>

                </select>

            </div>

        </div>

        <!-- Table -->

        <div class="table-responsive">

            <table class="table align-middle">

                <thead>

                    <tr>

                        <th>Exam</th>

                        <th>Date</th>

                        <th>Questions</th>

                        <th>Score</th>

                        <th>Percentage</th>

                        <th>Status</th>

                        <th></th>

                    </tr>

                </thead>

                <tbody id="historyBody">

                </tbody>

            </table>

        </div>

    </div>

</div>

















    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> 
    <script src="history.js"></script> 
</body>
</html>
