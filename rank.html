<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="rank.css">
</head>
<body>
    <div class="d-flex h-100">

            <div class="bg-white p-3 d-flex flex-column justify-content-between" style="width: 260px;">
                <div>

                    <div class="d-flex align-items-center gap-3 mb-4 border-bottom">
                        <img src="assets/IMG-20260806-WA0003.jpg" class="computer" alt="logo">
                        <div>
                            <h5 class="fw-bold text-dark MMO">MM&O</h5>
                        </div>
                    </div>

                    <div class="d-flex flex-column gap-2">
                        <a href="exam.html" class="btn fw-bold texnav">
                            <i class="bi bi-house-door-fill me-2"></i> Home
                        </a>
                        <a href="history.html" class="btn fw-bold texnav">
                            <i class="bi bi-clock-history me-2"></i> Quiz History
                        </a>
                        <a href="rank.html" class="btn fw-bold texnav">
                            <i class="bi bi-trophy me-2"></i> Rank with Friends
                        </a>
                    </div>
                </div>

                <div>
                    <div class="d-flex flex-column gap-2 mb-3">
                        <button id="deleteBtn" class="btn fw-bold setting"><i class="bi bi-trash3 me-2"></i>Delete
                            Profile</button>
                        <button id="logoutBtn" class="btn fw-bold setting"><i class="bi bi-box-arrow-right me-2"></i>Log
                            Out</button>
                    </div>
                </div>
            </div>
            <div class="container py-5">

    <div class="ranking-card">

      

        <div class="d-flex align-items-center mb-4">

            <i class="bi bi-trophy ranking-icon"></i>

            <div class="ms-3">

                <h2 class="fw-bold mb-1">
                    Your Ranking
                </h2>

                <p class="text-muted mb-0">
                    See your ranking among your classmates
                </p>

            </div>

        </div>

     

        <div class="row g-4 mb-5">

            <div class="col-lg-4">

                <div class="top-card first">

                    <div class="d-flex justify-content-between align-items-center">

                        <div class="d-flex align-items-center">

                            <div class="medal gold">
                                
                                &#129351;
                            </div>

                            <div class="ms-3">

                                <h4 id="firstName"></h4>

                                <h5 id="firstScore"></h5>

                            </div>

                        </div>

                        <h2 id="firstPercentage">
                            
                        </h2>

                    </div>

                </div>

            </div>

            <div class="col-lg-4">

                <div class="top-card second">

                    <div class="d-flex justify-content-between align-items-center">

                        <div class="d-flex align-items-center">

                            <div class="medal silver">
                                &#129352;
                            </div>

                            <div class="ms-3">

                                <h4 id="secondName"></h4>

                                <h5 id="secondScore"></h5>

                            </div>

                        </div>

                        <h2 id="secondPercentage">
                            
                        </h2>

                    </div>

                </div>

            </div>

            <div class="col-lg-4">

                <div class="top-card third">

                    <div class="d-flex justify-content-between align-items-center">

                        <div class="d-flex align-items-center">

                            <div class="medal bronze">
                                &#129353;
                            </div>

                            <div class="ms-3">

                                <h4 id="thirdName"></h4>

                                <h5 id="thirdScore"></h5>

                            </div>

                        </div>

                        <h2 id="thirdPercentage">
                            
                        </h2>

                    </div>

                </div>

            </div>

        </div>

       

        <div class="table-responsive">

            <table class="table align-middle">

                <thead>

                    <tr>

                        <th>Rank</th>

                        <th>Student</th>

                        <th>Score</th>

                        <th>Percentage</th>

                    </tr>

                </thead>

                <tbody id="rankingBody">

                </tbody>

            </table>

        </div>

       

    </div>

</div>
   
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> 
   <script src="rank.js"></script>  
</body>
</html>
