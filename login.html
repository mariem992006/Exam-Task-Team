<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Log In</title>
</head>

<body>
    <div class="py-5 welcome">

        <div class="text-center text-white mb-5">
            <h1 class="welcome-color fw-bold">Welcome back!</h1>
        </div>

        <div class="welcome-card mx-auto">
            <div class="row align-items-center">

                <div class="col-lg-6">
                    <img src="assets\welcome photo.png" class="welcome-logo" alt="Character">
                </div>

                <div class="col-lg-6">
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" id="loginPassword" class="form-control"
                                placeholder="Enter your password">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold d-block">Academic Year</label>

                            <div class="dropdown">
                                <button class="btn dropdown-toggle dropyear" type="button" id="yearBtn"
                                    data-bs-toggle="dropdown">
                                    Select Your Year
                                </button>

                                <ul class="dropdown-menu">
                                    <li><a href="#" onclick="chooseYear('year1.html','First Year')" class="dropdown-item drop">First Year</a>
                                    </li>
                                    <li><a href="#" onclick="chooseYear('year2.html','Second Year')" class="dropdown-item drop">Second Year</a>
                                    </li>
                                    <li><a href="#" onclick="chooseYear('year3.html','Third Year')" class="dropdown-item drop">Third Year</a>
                                    </li>
                                    <li><a href="#" onclick="chooseYear('year4.html','Fourth Year')" class="dropdown-item drop">Fourth Year</a>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <button type="button" onclick="login()" class="btn px-4 py-2 Signup-btn">
                            Log In
                        </button>

                        <p class="text-center mt-3 welcome-p">
                            Don't have an account? <a href="Signup.html" class="fw-bold login">Sign up</a>
                        </p>
                    </form>
                </div>

            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
