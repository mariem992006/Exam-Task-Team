<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="grade.css">
</head>
<body>
    
   <div class="d-flex h-100">
    

            <div class="bg-white p-3 d-flex flex-column justify-content-between" style="width: 260px;">
                <div>

                    <div class="d-flex align-items-center gap-3 mb-4 border-bottom">
                        <img src="assets/IMG-20260806-WA0003.jpg" class="computer" alt="logo">
                        <div>
                            <h5 class="fw-bold text-dark MMO">MM&O</h5>
                        </div>
                    </div>

                    <div class="d-flex flex-column gap-2">
                        <a href="exam.html" class="btn fw-bold texnav">
                            <i class="bi bi-house-door-fill me-2"></i> Home
                        </a>
                        <a href="history.html" class="btn fw-bold texnav">
                            <i class="bi bi-clock-history me-2"></i> Quiz History
                        </a>
                        <a href="rank.html" class="btn fw-bold texnav">
                            <i class="bi bi-trophy me-2"></i> Rank with Friends
                        </a>
                    </div>
                </div>
                

                <div>
                    
                    <div class="d-flex flex-column gap-2 mb-3">
                        <button id="deleteBtn" class="btn fw-bold setting"><i class="bi bi-trash3 me-2"></i>Delete
                            Profile</button>
                        <button id="logoutBtn" class="btn fw-bold setting"><i class="bi bi-box-arrow-right me-2"></i>Log
                            Out</button>
                    </div>
                </div>
            </div>
    <div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <div class="result-card">
                <div class="text-center mb-5">

    <h1 class="fw-bold">
        Exam Result :
    </h1>

    <h4 id="examName" class="mt-3"></h4>

    <p class="text-muted">
        Submitted on :
         <span id="submitDate"></span>
    </p>
    

</div>
<div class="row g-4 text-center">

    <div class="col-lg-3">
        <div class="info-card total-card">

            <p>Total Questions</p>

            <h2 id="totalQuestions"></h2>
             <div class="icon-circle total-icon">
        <i class="bi bi-file-earmark-text"></i>
    </div>

        </div>
    </div>

    <div class="col-lg-3">
        <div class="info-card correct-card">

            <p>Correct Answers</p>

            <h2 id="correctAnswers"></h2>
                <div class="icon-circle correct-icon">
        <i class="bi bi-check-lg"></i>
    </div>


        </div>
    </div>

    <div class="col-lg-3">
        <div class="info-card wrong-card">

            <p>Wrong Answers</p>

            <h2 id="wrongAnswers"></h2>
             <div class="icon-circle wrong-icon">
        <i class="bi bi-x-lg"></i>
    </div>

        </div>
    </div>

    <div class="col-lg-3">
        <div class="info-card score-card">

            <p>Score</p>

            <h2 id="score"></h2>
             <div class="icon-circle score-icon">
        <i class="bi bi-trophy"></i>
    </div>

        </div>
    </div>
    <div class="row mt-5">
    <div class="col-12 d-flex justify-content-center">

        <div class="score-circle">
            <span id="percentage"></span>

        </div>

    </div>
</div>
<div class="row mt-5 g-3 justify-content-center">

    <div class="col-lg-3 col-md-6">
        <a href="#" id="dashboardBtn" class="btn custom-btn dashboard-btn w-100">
            <i class="bi bi-house-door me-2"></i>
            Back to Dashboard
        </a>
    </div>



    <div class="col-lg-3 col-md-6">
        <a href="history.html" class="btn custom-btn history-btn w-100">
            <i class="bi bi-clock-history me-2"></i>
            View History
        </a>
    </div>

    <div class="col-lg-3 col-md-6">
        <a href="rank.html" class="btn custom-btn ranking-btn w-100">
            <i class="bi bi-trophy me-2"></i>
            View Ranking
        </a>
    </div>
    <div class="status-bar">
    <i class="bi bi-check-circle-fill"></i>
    <span>Result Saved Successfully</span>
</div>

</div>
    

</div>
            </div>

        </div>

    </div>

</div>





























     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> 
   <script src="grade.js"></script> 
</body>
</html>
